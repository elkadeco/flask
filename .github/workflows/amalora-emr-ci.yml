name: Amalora EMR CI
on:
  pull_request:
    paths:
      - 'amalora_emr/**'
      - '.github/workflows/amalora-emr-ci.yml'
  push:
    branches: ['amalora-emr-v2']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amalora_emr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
